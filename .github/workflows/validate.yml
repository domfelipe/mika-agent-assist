name: Validate Mika Agent Assist

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.14

      - name: Type-check edge functions
        shell: bash
        run: |
          files="$(
            find supabase/functions \
              -path '*/node_modules/*' -prune -o \
              -type f \( -path '*/_shared/*.ts' -o -name 'index.ts' \) \
              -print | sort
          )"
          if [ -z "$files" ]; then
            echo "No edge function files found"
            exit 1
          fi
          deno check --no-lock --config supabase/functions/deno.json $files
